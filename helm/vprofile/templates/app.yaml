apiVersion: apps/v1
kind: Deployment
metadata: { name: vproapp, labels: { app: vproapp } }
spec:
  replicas: {{ .Values.app.replicas }}
  selector: { matchLabels: { app: vproapp } }
  template:
    metadata: { labels: { app: vproapp } }
    spec:
      initContainers:                    # wait for the DB before Tomcat starts (replaces compose depends_on)
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z vprodb 3306; do echo waiting for vprodb; sleep 5; done"]
      containers:
        - name: vproapp
          image: "{{ .Values.registry }}/{{ .Values.app.image }}:{{ .Values.app.tag }}"
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 120
            periodSeconds: 20
          resources: { requests: { cpu: 200m, memory: 768Mi }, limits: { memory: 1536Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: vproapp }
spec:
  selector: { app: vproapp }
  ports: [{ port: 8080, targetPort: 8080 }]
